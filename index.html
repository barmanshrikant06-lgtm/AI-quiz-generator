
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Quiz Generator</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, Arial, sans-serif;
}

body {
  min-height: 100vh;
  color: #1e293b;
  background: linear-gradient(135deg, #eef2ff, #f5f3ff, #e0f2fe);
  padding: 25px;
}

.container {
  max-width: 900px;
  margin: auto;
}

header {
  text-align: center;
  padding: 30px 15px;
}

.logo {
  display: inline-block;
  background: #6366f1;
  color: white;
  padding: 12px 16px;
  border-radius: 15px;
  font-size: 25px;
  margin-bottom: 15px;
}

header h1 {
  font-size: 36px;
  color: #312e81;
  margin-bottom: 10px;
}

header p {
  color: #64748b;
}

.panel {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(79,70,229,.10);
  margin-bottom: 20px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field.full {
  grid-column: 1/-1;
}

label {
  font-weight: 700;
  font-size: 14px;
}

input, select {
  width: 100%;
  border: 1px solid #dbe2ef;
  padding: 14px;
  border-radius: 12px;
  outline: none;
  font-size: 15px;
  background: #fafbff;
}

input:focus, select:focus {
  border-color: #6366f1;
}

button {
  border: none;
  padding: 14px 20px;
  border-radius: 12px;
  background: #6366f1;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #4f46e5;
  transform: translateY(-1px);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
  transform: none;
}

.generate-btn {
  width: 100%;
  margin-top: 20px;
}

.hidden {
  display: none !important;
}

.status {
  text-align: center;
  padding: 20px;
  color: #6366f1;
  font-weight: bold;
}

.quiz-header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.badge {
  padding: 8px 12px;
  border-radius: 30px;
  background: #eef2ff;
  color: #4338ca;
  font-size: 13px;
  font-weight: bold;
}

.question-card {
  border: 1px solid #e5e7eb;
  padding: 22px;
  border-radius: 16px;
  margin-bottom: 18px;
}

.question-card h3 {
  margin-bottom: 16px;
  line-height: 1.5;
}

.options {
  display: grid;
  gap: 10px;
}

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 13px;
  cursor: pointer;
  transition: .15s;
}

.option:hover {
  background: #f5f3ff;
  border-color: #a5b4fc;
}

.option input {
  width: auto;
  accent-color: #6366f1;
}

.option.selected {
  background: #eef2ff;
  border-color: #6366f1;
}

.option.correct {
  background: #dcfce7;
  border-color: #22c55e;
}

.option.wrong {
  background: #fee2e2;
  border-color: #ef4444;
}

.explanation {
  margin-top: 14px;
  background: #f8fafc;
  padding: 12px;
  border-radius: 10px;
  color: #475569;
  line-height: 1.5;
}

.actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.actions button {
  flex: 1;
}

.score {
  text-align: center;
  padding: 30px 15px;
}

.score h2 {
  font-size: 35px;
  color: #4338ca;
  margin: 15px;
}

.score p {
  color: #64748b;
  font-size: 17px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
  padding: 14px;
  border-radius: 12px;
  margin-top: 15px;
  overflow-wrap: anywhere;
}

footer {
  text-align: center;
  padding: 20px;
  color: #64748b;
  font-size: 13px;
}

@media(max-width:600px) {
  body {
    padding: 12px;
  }

  header h1 {
    font-size: 28px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .panel {
    padding: 18px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">🧠</div>
  <h1>AI Quiz Generator</h1>
  <p>Create smart quizzes instantly using AI</p>
</header>

<!-- Generator form -->
<div class="panel" id="generator">

  <div class="form-grid">

    <div class="field full">
      <label for="topic">Quiz Topic</label>
      <input id="topic" placeholder="e.g. Solar System, Science, HTML..." />
    </div>

    <div class="field">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="Easy">Easy</option>
        <option value="Medium" selected>Medium</option>
        <option value="Hard">Hard</option>
      </select>
    </div>

    <div class="field">
      <label for="count">Number of Questions</label>
      <select id="count">
        <option value="5">5 Questions</option>
        <option value="10" selected>10 Questions</option>
        <option value="15">15 Questions</option>
        <option value="20">20 Questions</option>
      </select>
    </div>

    <div class="field">
      <label for="language">Quiz Language</label>
      <select id="language">
        <option value="English">English</option>
        <option value="Hindi">Hindi</option>
        <option value="Hinglish">Hinglish</option>
      </select>
    </div>

  </div>

  <button class="generate-btn" id="generateBtn" onclick="generateQuiz()">
    ✨ Generate AI Quiz
  </button>

  <div id="errorBox" class="error hidden"></div>
</div>

<div id="loading" class="panel status hidden">
  <div style="font-size:35px">🤖</div>
  <p id="loadingText">AI is creating your quiz...</p>
</div>

<!-- Quiz area -->
<div id="quizArea" class="panel hidden"></div>

<!-- Result -->
<div id="resultArea" class="panel hidden"></div>

<footer>
  Powered by Groq AI ⚡
</footer>

</div>

<script>
// ==========================================
// GROQ API SETTINGS
// ==========================================

// Paste your Groq API key here:
const API_KEY = "YOUR_GROQ_API_KEY_HERE";

const MODEL = "llama-3.3-70b-versatile";

let quizData = [];
let userAnswers = {};
let submitted = false;

// ==========================================
// GENERATE QUIZ
// ==========================================

async function generateQuiz() {

  const topic = document.getElementById("topic").value.trim();
  const difficulty = document.getElementById("difficulty").value;
  const count = Number(document.getElementById("count").value);
  const language = document.getElementById("language").value;

  const errorBox = document.getElementById("errorBox");

  errorBox.classList.add("hidden");

  if (!topic) {
    showError("Please enter a quiz topic!");
    return;
  }

  if (API_KEY === "YOUR_GROQ_API_KEY_HERE") {
    showError("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.");
    return;
  }

  document.getElementById("generateBtn").disabled = true;
  document.getElementById("loading").classList.remove("hidden");
  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("resultArea").classList.add("hidden");

  document.getElementById("loadingText").textContent =
    "Generating " + count + " questions about " + topic + "...";

  try {

    const prompt = `
Create ${count} multiple-choice quiz questions.

Topic: ${topic}
Difficulty: ${difficulty}
Language: ${language}

Return ONLY valid JSON in this exact format:

{
  "title": "Quiz title",
  "questions": [
    {
      "question": "Question text",
      "options": ["Option A", "Option B", "Option C", "Option D"],
      "answer": 0,
      "explanation": "Explain why the correct answer is right"
    }
  ]
}

Rules:
- Generate exactly ${count} questions.
- Each question must have exactly 4 options.
- answer must be a number from 0 to 3 representing the correct option index.
- Questions must be educational and factually correct.
- Do not repeat questions.
- Explanations should be short and useful.
- Return JSON only, no markdown.
`;

    const response = await fetch(
      "https://api.groq.com/openai/v1/chat/completions",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            {
              role: "system",
              content: "You are an expert quiz generator. Always return valid JSON."
            },
            {
              role: "user",
              content: prompt
            }
          ],
          temperature: 0.7,
          response_format: {
            type: "json_object"
          }
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || "API request failed");
    }

    let content = data.choices[0].message.content;

    // Remove markdown if present
    content = content.replace(/```json/gi, "")
                     .replace(/```/g, "")
                     .trim();

    const parsed = JSON.parse(content);

    if (!parsed.questions || !Array.isArray(parsed.questions)) {
      throw new Error("AI returned an invalid quiz format.");
    }

    quizData = parsed.questions.slice(0, count);
    userAnswers = {};
    submitted = false;

    renderQuiz(parsed.title || topic);

  } catch (error) {
    showError("Error: " + error.message);
  } finally {
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("generateBtn").disabled = false;
  }
}

// ==========================================
// DISPLAY QUIZ
// ==========================================

function renderQuiz(title) {

  const area = document.getElementById("quizArea");

  let html = `
    <div class="quiz-header">
      <h2>${escapeHTML(title)}</h2>
      <span class="badge">${quizData.length} Questions</span>
    </div>
  `;

  quizData.forEach((q, index) => {

    html += `
      <div class="question-card" id="question-${index}">
        <h3>${index + 1}. ${escapeHTML(q.question)}</h3>

        <div class="options">
    `;

    q.options.forEach((option, optionIndex) => {

      html += `
        <label class="option" id="option-${index}-${optionIndex}">
          <input
            type="radio"
            name="q${index}"
            value="${optionIndex}"
            onchange="selectAnswer(${index}, ${optionIndex})"
          >
          <span>${escapeHTML(option)}</span>
        </label>
      `;
    });

    html += `
        </div>
        <div class="explanation hidden" id="explanation-${index}"></div>
      </div>
    `;
  });

  html += `
    <div class="actions">
      <button onclick="submitQuiz()" id="submitBtn">
        ✅ Submit Quiz
      </button>

      <button onclick="generateQuiz()">
        🔄 Generate New Quiz
      </button>
    </div>
  `;

  area.innerHTML = html;
  area.classList.remove("hidden");

  area.scrollIntoView({ behavior: "smooth" });
}

// ==========================================
// SELECT ANSWER
// ==========================================

function selectAnswer(questionIndex, optionIndex) {

  if (submitted) return;

  userAnswers[questionIndex] = optionIndex;

  const options = document.querySelectorAll(
    `input[name="q${questionIndex}"]`
  );

  options.forEach(input => {
    input.parentElement.classList.remove("selected");
  });

  document.getElementById(
    `option-${questionIndex}-${optionIndex}`
  ).classList.add("selected");
}

// ==========================================
// SUBMIT QUIZ
// ==========================================

function submitQuiz() {

  if (submitted) return;

  const unanswered = quizData.filter((q, index) =>
    userAnswers[index] === undefined
  ).length;

  if (unanswered > 0) {

    if (!confirm(
      `You have ${unanswered} unanswered questions. Submit anyway?`
    )) {
      return;
    }
  }

  submitted = true;

  let score = 0;

  quizData.forEach((q, index) => {

    const selected = userAnswers[index];
    const correct = Number(q.answer);

    if (selected === correct) {
      score++;
    }

    q.options.forEach((option, optionIndex) => {

      const element = document.getElementById(
        `option-${index}-${optionIndex}`
      );

      const input = element.querySelector("input");
      input.disabled = true;

      if (optionIndex === correct) {
        element.classList.add("correct");
      }

      if (optionIndex === selected && selected !== correct) {
        element.classList.add("wrong");
      }
    });

    const explanation = document.getElementById(
      `explanation-${index}`
    );

    explanation.innerHTML = `
      <strong>
        ${selected === correct ? "✅ Correct!" : "❌ Incorrect"}
      </strong><br>
      Correct Answer: ${escapeHTML(q.options[correct])}<br><br>
      ${escapeHTML(q.explanation || "No explanation provided.")}
    `;

    explanation.classList.remove("hidden");
  });

  document.getElementById("submitBtn").disabled = true;

  showResult(score, quizData.length);
}

// ==========================================
// SHOW RESULT
// ==========================================

function showResult(score, total) {

  const percentage = Math.round((score / total) * 100);

  let message = "Keep practicing! 💪";

  if (percentage >= 90) {
    message = "Outstanding! 🏆";
  } else if (percentage >= 70) {
    message = "Great job! 🎉";
  } else if (percentage >= 50) {
    message = "Good effort! 👍";
  }

  const result = document.getElementById("resultArea");

  result.innerHTML = `
    <div class="score">
      <div style="font-size:55px">🏆</div>
      <h2>${score} / ${total}</h2>
      <p><strong>${percentage}%</strong> Score</p>
      <h3 style="margin-top:15px">${message}</h3>

      <button style="margin-top:25px" onclick="generateQuiz()">
        🔄 Try Another Quiz
      </button>
    </div>
  `;

  result.classList.remove("hidden");
  result.scrollIntoView({ behavior: "smooth" });
}

// ==========================================
// HELPERS
// ==========================================

function showError(message) {
  const box = document.getElementById("errorBox");
  box.textContent = message;
  box.classList.remove("hidden");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}
</script>

</body>
</html>
